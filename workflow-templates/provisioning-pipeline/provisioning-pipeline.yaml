apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provisioning-pipeline
spec:
  entrypoint: print-message
  arguments:
    parameters:
      - name: message
        value: hello world
  templates:
    - name: print-message
      inputs:
        parameters:
          - name: message
      container:
        image: busybox
        command: [echo]
        args: ["{Hello world to ---> ${inputs.parameters.message}}"]